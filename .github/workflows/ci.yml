name: MCP Server CI

on:
  push:
    branches:
      - dev
      - contrib

  pull_request:
    branches:
      - dev
      - contrib
      - release

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Build shadow JAR
        run: ./gradlew shadowJar --stacktrace

      - name: Upload MCP server JAR
        uses: actions/upload-artifact@v4
        with:
          name: android-mcp-server
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7